
spring:
  application:
    name: ai-code-reviewer

  datasource:
    url: jdbc:h2:file:./data/reviewer
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# Application Configuration
app:
  github:
    api-url: https://api.github.com
    token: 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

  ollama:
    api-url: http://localhost:11434
    model: codellama
    timeout: 120000

  async:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 100

logging:
  level:
    com.accenture.R2L: DEBUG
    org.springframework.web: INFO